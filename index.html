<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>休戚与共</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
            /* 稳定显示背景图，无闪现 */
            background: url('bg.png') center center / cover no-repeat fixed;
            /* 如果是jpeg格式，把上面的bg.jpg改成bg.jpeg */
            text-align: center;
            padding: 40px 20px;
            font-family: "微软雅黑", sans-serif;
            overflow-x: hidden;
            cursor: pointer;
        }
        /* 文字区域半透明背景，保证可读性 */
        .content-wrapper{
            position:relative;
            z-index:1;
            background: rgba(255,255,255,0.85);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
        }
        h1{
            color: #c71585;
            font-size: 42px;
            margin-bottom: 15px;
        }
        .en-name{
            font-size: 30px;
            color: #b1285a;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }
        /* 照片轮播容器：720px×720px（放大一倍） */
        .carousel-container{
            margin: 20px auto;
            width: 720px;
            height: 720px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(177, 40, 90, 0.3);
            background: #fff;
        }
        .carousel-slide{
            display: flex;
            transition: transform 0.8s ease;
        }
        /* 照片尺寸同步放大 */
        .carousel-slide img{
            width: 720px;
            height: 720px;
            object-fit: cover; /* 保证图片不变形 */
            flex-shrink: 0;
        }
        .heart-main{
            font-size: 60px;
            color: #e6396e;
            margin: 20px 0;
        }
        .wish{
            font-size: 20px;
            color: #222;
            line-height: 2.3;
            padding: 0 20px;
            font-weight: 500;
        }
        .time{
            margin-top: 30px;
            font-size: 16px;
            color: #555;
            padding-bottom: 30px;
        }
        /* 音乐播放提示 */
        .music-tip{
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        /* 隐藏的本地音乐播放器（仅后台播放） */
        #local-music{
            display: none; /* 隐藏播放器界面，只保留音频播放 */
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>✨ 十七姻缘路，芳华婉如初 ✨</h1>
        <div class="en-name">回岁忆月</div>

        <!-- 11张照片轮播（720px） -->
        <div class="carousel-container">
            <div class="carousel-slide" id="carousel">
                <img src="photo1.jpg" alt="照片1">
                <img src="photo2.jpg" alt="照片2">
                <img src="photo3.jpg" alt="照片3">
                <img src="photo4.jpg" alt="照片4">
                <img src="photo5.jpg" alt="照片5">
                <img src="photo6.jpg" alt="照片6">
                <img src="photo7.jpg" alt="照片7">
                <img src="photo8.jpg" alt="照片8">
                <img src="photo9.jpg" alt="照片9">
                <img src="photo10.jpg" alt="照片10">
                <img src="photo11.jpg" alt="照片11">
                <img src="photo12.jpg" alt="照片12">
                <img src="photo13.jpg" alt="照片13">
                <img src="photo14.jpg" alt="照片14">
                <img src="photo15.jpg" alt="照片15">
                <img src="photo16.jpg" alt="照片16">
                <img src="photo17.jpg" alt="照片17">
                <img src="photo18.jpg" alt="照片18">
                <img src="photo19.jpg" alt="照片19">
                <img src="photo20.jpg" alt="照片20">
                <img src="photo21.jpg" alt="照片21">
                <img src="photo22.jpg" alt="照片22">
                <img src="photo23.jpg" alt="照片23">
            </div>
        </div>

        <div class="heart-main">❤</div>

        <!-- 专属文案 -->
        <div class="wish">
            一程婚姻，稚子青葱；<br>
            一程相守，半生温柔。<br>
            三餐四季，朝夕相伴，<br>
            余生种种，白首不离。
        </div>

        <!-- 音乐播放提示 -->
        <div class="music-tip">👉 点击页面任意位置播放音乐 👈</div>

        <div class="time" id="nowTime"></div>
    </div>

    <!-- 本地音乐播放器（核心修改：替换B站iframe） -->
    <audio id="local-music" src="birthday.mp3" loop></audio>

<script>
// 日期显示
function showTime(){
    let d = new Date();
    document.getElementById("nowTime").innerText = "一起走过 · " + d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}
showTime();

// 照片轮播逻辑（720px适配）
const carousel = document.getElementById('carousel');
let index = 0;
const totalImages = 23;
const photoWidth = 720;

function carouselLoop() {
    index++;
    if (index >= totalImages) index = 0;
    carousel.style.transform = `translateX(-${index * photoWidth}px)`;
}
carouselLoop();
setInterval(carouselLoop, 2800);

// 本地音乐播放逻辑（核心修改）
const musicPlayer = document.getElementById('local-music');
let isPlayed = false;

// 点击页面播放音乐（仅第一次点击生效）
document.addEventListener("click", () => {
    if (!isPlayed) {
        try {
            // 播放本地音乐
            musicPlayer.play();
            document.querySelector('.music-tip').innerText = "🎵 音乐正在播放 🎵";
            isPlayed = true;
        } catch (err) {
            // 兼容部分浏览器的自动播放限制
            alert("请手动点击播放音乐：\n1. 刷新页面\n2. 再次点击页面任意位置");
        }
    }
}, { once: true });
</script>
</body>
</html>
