<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>祝妹丁生日快乐</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,body{
            height: 100%;
            /* 优化背景图显示：固定+铺满，解决闪现问题 */
            background: url('bg.png') center center / cover no-repeat fixed;
            /* 如果是jpeg格式，把上面的bg.jpg改成bg.jpeg */
            text-align: center;
            padding: 40px 20px;
            font-family: "微软雅黑", sans-serif;
            overflow-x: hidden;
            cursor: pointer;
        }
        /* 文字区域半透明背景，保证可读性 */
        .content-wrapper{
            position:relative;
            z-index:1;
            background: rgba(255,255,255,0.85);
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            margin-top: 20px;
        }
        h1{
            color: #c71585;
            font-size: 42px;
            margin-bottom: 15px;
        }
        .en-name{
            font-size: 30px;
            color: #b1285a;
            margin-bottom: 20px;
            letter-spacing: 5px;
        }
        /* 照片轮播容器 */
        .carousel-container{
            margin: 20px auto;
            width: 360px;
            height: 360px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(177, 40, 90, 0.3);
            background: #fff;
        }
        .carousel-slide{
            display: flex;
            transition: transform 0.8s ease;
        }
        .carousel-slide img{
            width: 360px;
            height: 360px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .heart-main{
            font-size: 60px;
            color: #e6396e;
            margin: 20px 0;
        }
        .wish{
            font-size: 20px;
            color: #222;
            line-height: 2.3;
            padding: 0 20px;
            font-weight: 500;
        }
        .time{
            margin-top: 30px;
            font-size: 16px;
            color: #555;
            padding-bottom: 30px;
        }
        /* 音乐播放提示 */
        .music-tip{
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        /* B站播放器：隐藏仅保留音频 */
        #bilibili-player{
            position: fixed;
            bottom: -100px;
            left: 0;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div class="content-wrapper">
        <h1>✨ 生日快乐 ✨</h1>
        <div class="en-name">妹丁</div>

        <!-- 11张照片轮播 -->
        <div class="carousel-container">
            <div class="carousel-slide" id="carousel">
                <img src="photo1.jpg" alt="照片1">
                <img src="photo2.jpg" alt="照片2">
                <img src="photo3.jpg" alt="照片3">
                <img src="photo4.jpg" alt="照片4">
                <img src="photo5.jpg" alt="照片5">
                <img src="photo6.jpg" alt="照片6">
                <img src="photo7.jpg" alt="照片7">
                <img src="photo8.jpg" alt="照片8">
                <img src="photo9.jpg" alt="照片9">
                <img src="photo10.jpg" alt="照片10">
                <img src="photo11.jpg" alt="照片11">
            </div>
        </div>

        <div class="heart-main">❤</div>

        <!-- 专属文案 -->
        <div class="wish">
            一程婚姻，稚子青葱；<br>
            一程相守，半生温柔。<br>
            三餐四季，朝夕相伴，<br>
            余生种种，白首不离。
        </div>

        <!-- 音乐播放提示 -->
        <div class="music-tip">👉 点击页面任意位置播放音乐 👈</div>

        <div class="time" id="nowTime"></div>
    </div>

    <!-- B站音频播放器 -->
    <iframe id="bilibili-player"
            src="https://player.bilibili.com/player.html?bvid=BV1MP4y187LL&autoplay=1&loop=1&muted=1&danmaku=0&controls=0"
            frameborder="0"
            allow="autoplay; fullscreen; encrypted-media"
            allowfullscreen>
    </iframe>

<script>
// 日期显示
function showTime(){
    let d = new Date();
    document.getElementById("nowTime").innerText = "致我最爱的 Monica · " + d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
}
showTime();

// 照片轮播逻辑
const carousel = document.getElementById('carousel');
let index = 0;
const totalImages = 11;

function carouselLoop() {
    index++;
    if (index >= totalImages) index = 0;
    carousel.style.transform = `translateX(-${index * 360}px)`;
}
// 初始执行+定时轮播
carouselLoop();
setInterval(carouselLoop, 2800);

// B站音频播放控制
const playerIframe = document.getElementById('bilibili-player');
let isPlayed = false;

document.addEventListener("click", async () => {
    if (isPlayed) return;

    try {
        playerIframe.contentWindow.postMessage(JSON.stringify({
            "cmd": "play",
            "args": ["play"]
        }), "*");
        document.querySelector('.music-tip').innerText = "🎵 音乐正在播放 🎵";
        isPlayed = true;
    } catch (err) {
        playerIframe.src = playerIframe.src + "&autoplay=1";
        document.querySelector('.music-tip').innerText = "🎵 音乐正在播放 🎵";
        isPlayed = true;
    }
}, { once: true });
</script>
</body>
</html>
